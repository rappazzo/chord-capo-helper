<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar Capo Chord Optimizer</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 20px; background: #f5f5f5; min-height: 100vh;
        }
        .container { 
            max-width: 600px; margin: 0 auto; background: white; 
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden;
        }
        .header { 
            background: linear-gradient(135deg, #1976d2, #1565c0); color: white; 
            padding: 24px; text-align: center;
        }
        .header h1 { margin: 0; font-size: 24px; font-weight: 600; }
        .content { padding: 24px; }
        .input-section { margin-bottom: 24px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; }
        input { 
            width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 16px; transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #1976d2; }
        .buttons { display: flex; gap: 12px; margin-top: 12px; }
        button { 
            flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px;
            font-weight: 500; cursor: pointer; transition: all 0.2s;
        }
        .btn-primary { background: #1976d2; color: white; }
        .btn-primary:hover { background: #1565c0; }
        .btn-secondary { background: #f5f5f5; color: #666; border: 1px solid #ddd; }
        .btn-secondary:hover { background: #e0e0e0; }
        .btn-find { 
            width: 100%; padding: 16px; background: #4caf50; color: white; 
            font-size: 18px; font-weight: 600; margin: 24px 0;
        }
        .btn-find:hover { background: #45a049; }
        .btn-find:disabled { background: #ccc; cursor: not-allowed; }
        .chord-list { margin: 16px 0; }
        .chord-item { 
            display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f0f0;
        }
        .chord-item:last-child { border-bottom: none; }
        .chord-dot { width: 8px; height: 8px; background: #333; border-radius: 50%; margin-right: 12px; }
        .chord-name { flex: 1; font-size: 16px; }
        .remove-btn { 
            background: none; border: none; color: #999; cursor: pointer; 
            font-size: 18px; padding: 4px;
        }
        .remove-btn:hover { color: #f44336; }
        .results { margin-top: 24px; }
        .optimal-result { 
            background: linear-gradient(135deg, #4caf50, #45a049); color: white; 
            padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 16px;
        }
        .optimal-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .barre-count { font-size: 16px; opacity: 0.9; }
        .mappings { background: #f9f9f9; border-radius: 8px; padding: 16px; }
        .mapping-header { font-weight: 600; margin-bottom: 12px; color: #333; }
        .mapping-item { 
            display: flex; align-items: center; padding: 8px 0; 
            border-bottom: 1px solid #e0e0e0;
        }
        .mapping-item:last-child { border-bottom: none; }
        .mapping-original { flex: 1; }
        .mapping-arrow { margin: 0 12px; font-weight: bold; color: #666; }
        .mapping-result { flex: 2; }
        .barre-warning { color: #ff5722; font-weight: 500; }
        .partial-note { color: #f57c00; font-weight: 500; }
        .chord-tab { 
            font-family: 'Courier New', monospace; font-size: 12px; 
            background: #f0f0f0; padding: 8px; border-radius: 4px; 
            margin-top: 4px; line-height: 1.2;
        }
        .tab-strings { color: #666; }
        .tab-frets { font-weight: bold; }
        .all-positions { margin-top: 16px; }
        .position-item { 
            display: flex; align-items: center; padding: 12px; background: white;
            border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 8px;
            cursor: pointer; transition: all 0.2s;
        }
        .position-item:hover { background: #f5f5f5; border-color: #1976d2; }
        .position-fret { font-weight: 600; margin-right: 16px; min-width: 60px; }
        .position-count { flex: 1; }
        .position-best { color: #4caf50; font-weight: 600; }
        .position-caret { color: #999; margin-left: 12px; font-size: 12px; }
        .position-detail { margin: -4px 0 10px; border: 1px solid #e0e0e0; border-top: none; border-radius: 0 0 8px 8px; }
        .hidden { display: none; }
        .error { color: #f44336; font-size: 14px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎸 Guitar Capo Optimizer</h1>
        </div>
        
        <div class="content">
            <div class="input-section">
                <label for="chordInput">Enter Chords:</label>
                <input type="text" id="chordInput" placeholder="C Am F G7 Dmaj7 F#m" />
                <div class="buttons">
                    <button class="btn-primary" onclick="addChords()">Add Chords</button>
                    <button class="btn-secondary" onclick="clearAll()">Clear All</button>
                </div>
                <div id="error" class="error hidden"></div>
            </div>
            
            <div>
                <label>Current Chord List:</label>
                <div id="chordList" class="chord-list"></div>
            </div>
            
            <button id="findBtn" class="btn-find" onclick="findOptimalCapo()" disabled>
                FIND OPTIMAL CAPO
            </button>
            
            <div id="results" class="results hidden">
                <div id="optimalResult" class="optimal-result"></div>
                <div id="mappings" class="mappings"></div>
                <button class="btn-secondary" onclick="showAllPositions()" style="width: 100%; margin-top: 16px;">
                    VIEW ALL POSITIONS
                </button>
            </div>
            
            <div id="allPositions" class="all-positions hidden"></div>
        </div>
    </div>

    <script>
        let currentChords = [];
        let allResults = [];

        const chordNotes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        // Open-position shapes per chord quality. Frets are given at the nut
        // (open position). A capo raises every fretted/open note by `capo`
        // semitones, so an open shape played behind a capo sounds `capo`
        // semitones higher than its open root. To SOUND a chord rooted at
        // note R with the capo on fret N, you finger the shape rooted at
        // (R - N) mod 12. If an open shape exists for that root, no barre is
        // needed (the capo acts as the nut); otherwise a movable barre shape
        // is required.
        //
        // Tabs are low-E..high-E, one character per string:
        //   'x' = muted, '0' = open (relative to the shape's nut).
        const openShapeTabs = {
            major: { 'C': 'x32010', 'A': 'x02220', 'G': '320003', 'E': '022100', 'D': 'xx0232' },
            minor: { 'A': 'x02210', 'E': '022000', 'D': 'xx0231' },
            '7':   { 'C': 'x32310', 'A': 'x02020', 'G': '320001', 'E': '020100', 'D': 'xx0212', 'B': 'x21202' },
            m7:    { 'A': 'x02010', 'E': '020000', 'D': 'xx0211', 'B': 'x20202' },
            maj7:  { 'C': 'x32000', 'A': 'x02120', 'G': '320002', 'E': '021100', 'D': 'xx0222', 'F': 'xx3210' }
        };

        // Movable "partial" voicings rooted on the D string with the low two
        // "Partial" (bass-muted) voicings: take a movable barre chord and drop
        // the low string(s), leaving a compact grip rooted on the D string —
        // the natural "barre chord without the bottom strings." It sits at the
        // same low position the barre would (e.g. Bm as xx4432, small F as
        // xx3211), never crammed high up the neck.
        //
        // Two families, both keeping the root on the D string:
        //   E-shape barre (133211-style) with the low E and A dropped.
        //   A-shape barre (x133xx-style) with the low E and A dropped.
        // Only major/minor are offered: the 4-note seventh A/E-shapes lose the
        // root when the bass strings go, so those fall through to a real barre.
        // Each entry is the full barre tab (low-E..high-E); the mapping masks
        // the bottom two strings and positions it at the barre fret.
        const partialBarreShapes = {
            major: { E: '133211', A: 'x13331' },
            minor: { E: '133111', A: 'x13321' }
        };

        // Movable barre shapes (E-shape rooted on the low-E string, A-shape
        // rooted on the A string) used when no open shape is available.
        // Fret numbers are relative to the barre; the barre position is added
        // per capo/root below.
        const barreShapes = {
            major: { E: '133211', A: 'x13331' },
            minor: { E: '133111', A: 'x13321' },
            '7':   { E: '131211', A: 'x13131' },
            m7:    { E: '131111', A: 'x13121' },
            maj7:  { E: '132111', A: 'x13231' }
        };

        function qualityKey(chord) {
            const q = chord.slice(rootLength(chord));
            if (q === '') return 'major';
            if (q === 'm') return 'minor';
            if (q === '7') return '7';
            if (q === 'm7') return 'm7';
            if (q === 'maj7') return 'maj7';
            return 'major';
        }

        function rootLength(chord) {
            return (chord.length > 1 && (chord[1] === '#' || chord[1] === 'b')) ? 2 : 1;
        }

        function rootIndex(chord) {
            let root = chord.slice(0, rootLength(chord));
            // Normalize flats to sharps.
            const flatToSharp = { 'Db': 'C#', 'Eb': 'D#', 'Gb': 'F#', 'Ab': 'G#', 'Bb': 'A#', 'Cb': 'B', 'Fb': 'E' };
            if (flatToSharp[root]) root = flatToSharp[root];
            return chordNotes.indexOf(root);
        }

        // Parse a compact shape pattern (e.g. 'x02220', 'xx0232') into an array
        // of per-string frets: a number, or null for a muted ('x') string.
        // Patterns only ever use single-digit open-position frets, so char-wise
        // parsing is unambiguous here.
        function tabToFrets(pattern) {
            return pattern.split('').map(ch => (ch === 'x' ? null : parseInt(ch, 10)));
        }

        // Package a fret array into the mapping's display fields. `frets` holds
        // absolute fret numbers (as fretted on the neck). `relFrets` expresses
        // the same shape from the capo's perspective by subtracting the capo
        // position, which is how a player reading behind the capo sees it.
        function finalizeMapping(frets, capo, extra) {
            const toTokens = subtractCapo => frets.map(f => {
                if (f === null) return 'x';
                return String(subtractCapo ? f - capo : f);
            });
            const relTokens = toTokens(true);
            return Object.assign({
                frets,
                relTokens,
                absTokens: toTokens(false),
                tab: relTokens.join(' ')
            }, extra);
        }

        // Returns the best playable shape for `chord` sounded with the capo on
        // `capo`. Prefers an open shape (no barre); otherwise the lowest-fret
        // movable barre shape behind the capo.
        function getChordMapping(chord, capo) {
            const noteIndex = rootIndex(chord);
            if (noteIndex === -1) return null;

            const quality = qualityKey(chord);
            // Root of the shape we finger, expressed as an absolute note.
            const shapeRootIndex = ((noteIndex - capo) % 12 + 12) % 12;
            const shapeRootNote = chordNotes[shapeRootIndex];

            const openSet = openShapeTabs[quality];
            if (openSet && openSet[shapeRootNote]) {
                // Open shape: fingered identically behind the capo (capo = nut).
                // Absolute frets add the capo; the capo-relative view subtracts
                // it back out (so an open shape reads with 0s, as at the nut).
                const frets = tabToFrets(openSet[shapeRootNote])
                    .map(f => f === null ? null : f + capo);
                return finalizeMapping(frets, capo, { shape: shapeRootNote, barre: false });
            }

            // Partial (bass-muted) voicing: a barre shape with the low two
            // strings dropped, rooted on the D string. Treated as a non-barre
            // alternative. Build from both the E-shape and A-shape families and
            // take whichever sits lower (and at/above the capo). This keeps
            // e.g. Bm at the low fret-2 position (xx4432) instead of a cramped
            // grip high on the neck.
            const eIdx = chordNotes.indexOf('E');
            const aIdx = chordNotes.indexOf('A');
            const partialSet = partialBarreShapes[quality];
            if (partialSet) {
                const eFret = ((noteIndex - eIdx) % 12 + 12) % 12; // E-shape barre fret
                const aFret = ((noteIndex - aIdx) % 12 + 12) % 12; // A-shape barre fret
                const build = (barrePattern, barreFret) => {
                    // Keep strings D,G,B,e (indices 2..5); mask low E and A.
                    const abs = barrePattern.split('').map((ch, s) => {
                        if (s < 2 || ch === 'x') return null;
                        return (barreFret - 1) + parseInt(ch, 10);
                    });
                    const fretted = abs.filter(f => f !== null);
                    return { abs, lowest: Math.min(...fretted), position: barreFret };
                };
                const options = [];
                if (eFret > 0) options.push(build(partialSet.E, eFret));
                if (aFret > 0) options.push(build(partialSet.A, aFret));
                const usable = options.filter(o => o.lowest >= capo && o.lowest > 0);
                usable.sort((a, b) => a.position - b.position);
                if (usable.length) {
                    const p = usable[0];
                    return finalizeMapping(p.abs, capo,
                        { shape: 'D', barre: false, partial: true,
                          shapeLabel: 'partial (bass strings muted)' });
                }
            }

            // No open or partial shape -> use a movable barre shape. Choose
            // E-shape (rooted on low E) or A-shape (rooted on A string),
            // whichever sits lower.
            const eBarreFret = ((noteIndex - eIdx) % 12 + 12) % 12; // absolute fret of barre
            const aBarreFret = ((noteIndex - aIdx) % 12 + 12) % 12;

            // The capo sits at `capo`; the barre must be at/above it. Compute the
            // fret the barre lands on relative to the nut (absolute), pick the
            // shape whose barre is lowest but still >= capo.
            const shapes = barreShapes[quality] || barreShapes.major;
            const candidates = [];
            if (eBarreFret >= capo && eBarreFret > 0) candidates.push({ letter: 'E', barreFret: eBarreFret, tab: shapes.E });
            if (aBarreFret >= capo && aBarreFret > 0) candidates.push({ letter: 'A', barreFret: aBarreFret, tab: shapes.A });
            // Fall back to raw positions if capo is above both roots.
            if (candidates.length === 0) {
                candidates.push({ letter: 'E', barreFret: eBarreFret || 12, tab: shapes.E });
                candidates.push({ letter: 'A', barreFret: aBarreFret || 12, tab: shapes.A });
            }
            candidates.sort((a, b) => a.barreFret - b.barreFret);
            const chosen = candidates[0];
            const frets = tabToFrets(chosen.tab)
                .map(f => f === null ? null : f + (chosen.barreFret - 1));
            return finalizeMapping(frets, capo, { shape: chosen.letter, barre: true });
        }
        


        function parseChords(input) {
            return input.trim().split(/[,\s-]+/).filter(c => c).map(c => c.trim());
        }

        function isValidChord(chord) {
            return /^[A-G][#b]?(m|7|m7|maj7)?$/.test(chord) && rootIndex(chord) !== -1;
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
            setTimeout(() => errorEl.classList.add('hidden'), 3000);
        }

        function addChords() {
            const input = document.getElementById('chordInput').value;
            const newChords = parseChords(input);
            const validChords = newChords.filter(isValidChord);
            
            if (validChords.length !== newChords.length) {
                showError('Some chords were invalid. Supported: A-G# with m, 7, m7, maj7 variations');
            }
            
            currentChords = [...new Set([...currentChords, ...validChords])];
            document.getElementById('chordInput').value = '';
            updateChordList();
        }

        function removeChord(chord) {
            currentChords = currentChords.filter(c => c !== chord);
            updateChordList();
        }

        function clearAll() {
            currentChords = [];
            updateChordList();
            document.getElementById('results').classList.add('hidden');
            document.getElementById('allPositions').classList.add('hidden');
        }

        function updateChordList() {
            const listEl = document.getElementById('chordList');
            const findBtn = document.getElementById('findBtn');
            
            if (currentChords.length === 0) {
                listEl.innerHTML = '<div style="color: #999; font-style: italic;">No chords added yet</div>';
                findBtn.disabled = true;
            } else {
                listEl.innerHTML = currentChords.map(chord => `
                    <div class="chord-item">
                        <div class="chord-dot"></div>
                        <div class="chord-name">${formatChordName(chord)}</div>
                        <button class="remove-btn" onclick="removeChord('${chord}')">×</button>
                    </div>
                `).join('');
                findBtn.disabled = false;
            }
        }

        function formatChordName(chord) {
            const root = chord.slice(0, rootLength(chord));
            const quality = qualityKey(chord);
            const label = { major: 'Major', minor: 'Minor', '7': '7th', m7: 'Minor 7th', maj7: 'Major 7th' }[quality];
            return `${root} ${label}`;
        }

        function findOptimalCapo() {
            if (currentChords.length === 0) return;
            
            allResults = [];
            for (let capo = 0; capo <= 12; capo++) {
                let barreCount = 0;
                let partialCount = 0;
                const mappings = [];
                
                for (const chord of currentChords) {
                    const mapping = getChordMapping(chord, capo);
                    if (mapping && mapping.barre) barreCount++;
                    else if (mapping && mapping.partial) partialCount++;
                    mappings.push({ chord, ...mapping });
                }
                
                allResults.push({ capo, barreCount, partialCount, mappings });
            }
            
            // Prefer positions with the fewest full barres, then the fewest
            // bass-muted partials (they're playable but not as clean as a full
            // open shape), then the lowest fret.
            allResults.sort((a, b) =>
                a.barreCount - b.barreCount ||
                a.partialCount - b.partialCount ||
                a.capo - b.capo);
            showResults();
        }

        function countSummary(result) {
            const parts = [`Barre Chords: ${result.barreCount} of ${result.mappings.length}`];
            if (result.partialCount) parts.push(`Partial: ${result.partialCount}`);
            return parts.join(' &nbsp;•&nbsp; ');
        }

        // Shared renderer for a capo position's chord-by-chord fingerings.
        function renderMappings(result) {
            return `
                <div class="mapping-header">Original → With Capo Fret ${result.capo}</div>
                ${result.mappings.map(m => `
                    <div class="mapping-item">
                        <div class="mapping-original">${formatChordName(m.chord)}</div>
                        <div class="mapping-arrow">→</div>
                        <div class="mapping-result ${m.barre ? 'barre-warning' : (m.partial ? 'partial-note' : '')}">
                            ${m.shapeLabel || (m.shape + ' Shape')} ${m.barre ? '(Barre) ⚠️' : (m.partial ? '(Partial)' : '(Open)')}
                            <div class="chord-tab">
                                <div class="tab-strings">E A D G B E</div>
                                <div class="tab-frets">${m.relTokens.join(' ')}</div>
                            </div>
                        </div>
                    </div>
                `).join('')}
            `;
        }

        function showResults() {
            const optimal = allResults[0];
            document.getElementById('optimalResult').innerHTML = `
                <div class="optimal-title">🎯 OPTIMAL: Capo on Fret ${optimal.capo}</div>
                <div class="barre-count">${countSummary(optimal)}</div>
            `;
            document.getElementById('mappings').innerHTML = renderMappings(optimal);
            document.getElementById('results').classList.remove('hidden');
            document.getElementById('allPositions').classList.add('hidden');
        }

        let expandedCapo = null;

        function showAllPositions() {
            expandedCapo = null;
            renderAllPositions();
            document.getElementById('allPositions').classList.remove('hidden');
        }

        function renderAllPositions() {
            const best = allResults[0];
            document.getElementById('allPositions').innerHTML = `
                <h3>All Capo Positions</h3>
                <div style="color:#999; font-size:13px; margin-bottom:8px;">Tap a position to see its chord shapes.</div>
                ${allResults.map(result => `
                    <div class="position-item" onclick="togglePositionDetails(${result.capo})">
                        <div class="position-fret">Fret ${result.capo}</div>
                        <div class="position-count">${result.barreCount} barre${result.partialCount ? `, ${result.partialCount} partial` : ''} of ${result.mappings.length}</div>
                        ${result.barreCount === best.barreCount && result.partialCount === best.partialCount ? '<div class="position-best">🎯 BEST</div>' : ''}
                        <div class="position-caret">${expandedCapo === result.capo ? '▲' : '▼'}</div>
                    </div>
                    ${expandedCapo === result.capo ? `<div class="mappings position-detail">${renderMappings(result)}</div>` : ''}
                `).join('')}
            `;
        }

        function togglePositionDetails(capo) {
            expandedCapo = (expandedCapo === capo) ? null : capo;
            renderAllPositions();
        }

        document.getElementById('chordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addChords();
        });

        updateChordList();
    </script>
</body>
</html>
